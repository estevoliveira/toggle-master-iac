name: Terraform CI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: env/dev

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # --------------------------------------------------
      # Setup Terragrunt
      # --------------------------------------------------

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: latest

      # --------------------------------------------------
      # Terraform Format
      # --------------------------------------------------

      - name: Terraform Format
        working-directory: .
        run: terraform fmt -check -recursive


      # --------------------------------------------------
      # Terragrunt Init
      # --------------------------------------------------

      - name: Terragrunt Init
        run: terragrunt init


      # --------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------
      # Setup TFLint
      # --------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v1


      # --------------------------------------------------
      # TFLint
      # --------------------------------------------------

      - name: Initialize TFLint
        working-directory: .
        run: tflint --init


      - name: Run TFLint
        working-directory: .
        run: tflint --recursive


      # --------------------------------------------------
      # Checkov
      # --------------------------------------------------

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false


      # --------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: terragrunt plan -input=false
