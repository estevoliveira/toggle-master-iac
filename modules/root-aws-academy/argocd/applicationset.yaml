apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: toggle-master-services
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - service: platform
          - service: auth-service
          - service: flag-service
          - service: targeting-service
          - service: evaluation-service
          - service: analytics-service

  template:
    metadata:
      name: "{{.service}}"
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/ramondata/toggle-master-gitops.git
        targetRevision: master
        path: "apps/{{.service}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: toggle-master

      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: evaluation-service
          namespace: toggle-master
          jsonPointers:
            - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
        - group: apps
          kind: Deployment
          name: analytics-service
          namespace: toggle-master
          jsonPointers:
            - /spec/replicas
        - group: apps
          kind: Deployment
          name: evaluation-service
          namespace: toggle-master
          jsonPointers:
            - /spec/replicas

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - RespectIgnoreDifferences=true

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m


