apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-telemetry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ramondata/toggle-master-gitops.git
    targetRevision: master
    path: apps/observability-telemetry
    helm:
      releaseName: observability-telemetry
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - FailOnSharedResource=true
